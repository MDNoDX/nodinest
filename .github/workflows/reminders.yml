# Röznoma reminders: every 5 minutes the site sends due Telegram reminders.
# Needs the repository secret CRON_SECRET (the same value as in Vercel).
name: reminders
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: >
          curl -fsS -m 100 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          https://nodinest.vercel.app/api/cron/reminders
