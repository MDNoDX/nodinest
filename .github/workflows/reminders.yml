# Röznoma reminders: every 5 minutes the site sends the Telegram reminders
# that are due (each one once a day). Nothing to set up.
name: reminders
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -m 100 https://nodinest.vercel.app/api/cron/reminders || true
