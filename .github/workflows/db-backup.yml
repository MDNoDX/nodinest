# Kunlik baza zaxirasi: Neon Postgres → pg_dump → AES-256 bilan shifrlangan → workflow artefakti (30 kun saqlanadi).
# Repo ochiq, shuning uchun fayl faqat shifrlangan holda saqlanadi; kalit — BACKUP_PASSPHRASE secret'i.
# Tiklash: docs/backup-restore.md
name: DB backup
on:
  schedule:
    - cron: "30 0 * * *"   # har kuni 05:30 (Toshkent)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: pg_dump (Postgres 18)
        env:
          DB: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          docker run --rm -e DB postgres:18 sh -c 'pg_dump --no-owner --no-privileges -Fc "$DB"' > db.dump
          test -s db.dump
          ls -lh db.dump
      - name: Encrypt
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "nodinest-$(date -u +%F).dump.gpg" db.dump
          rm db.dump
      - name: Verify (decrypt + read archive)
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$PASS" -d nodinest-*.dump.gpg > check.dump
          n=$(docker run --rm -v "$PWD:/w" postgres:18 pg_restore --list /w/check.dump | grep -c "TABLE DATA")
          echo "tables with data: $n"
          rm check.dump
          test "$n" -gt 5
      - uses: actions/upload-artifact@v4
        with:
          name: nodinest-db-${{ github.run_id }}
          path: nodinest-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
